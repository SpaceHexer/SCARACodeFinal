[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
; Keine externen Bibliotheken; STEP/DIR direkt mit Timer3.

; Zusätzliche Build-Prüfungen der drei anderen STOP-Konfigurationen.
[env:mega_stop00]
extends = env:megaatmega2560
build_flags = ${env:megaatmega2560.build_flags} -DSCARA_STOP_BUTTON_1_ENABLED=0 -DSCARA_STOP_BUTTON_2_ENABLED=0
[env:mega_stop01]
extends = env:megaatmega2560
build_flags = ${env:megaatmega2560.build_flags} -DSCARA_STOP_BUTTON_1_ENABLED=0 -DSCARA_STOP_BUTTON_2_ENABLED=1
[env:mega_stop10]
extends = env:megaatmega2560
build_flags = ${env:megaatmega2560.build_flags} -DSCARA_STOP_BUTTON_1_ENABLED=1 -DSCARA_STOP_BUTTON_2_ENABLED=0
